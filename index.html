<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabon Adresse Numérique - Registre National</title>
    <style>
        :root {
            --primary-color: #009e49;
            --secondary-color: #fcd116;
            --dark-color: #333;
            --light-color: #f4f7f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }

        .flag-bar {
            height: 6px;
            width: 100%;
            display: flex;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .flag-green { flex: 1; background-color: #009e49; }
        .flag-yellow { flex: 1; background-color: #fcd116; }
        .flag-blue { flex: 1; background-color: #3a75c4; }

        h1, h2 {
            color: var(--dark-color);
            text-align: center;
            margin-top: 0;
        }

        p {
            color: #666;
            font-size: 14px;
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            font-weight: 600;
            color: #55px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .btn-gps, .btn-submit {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s ease;
            margin-top: 10px;
        }

        .btn-gps { background-color: #3a75c4; }
        .btn-gps:hover { background-color: #2a5a9e; }
        .btn-submit:hover { background-color: #00843d; }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #f9f9f9;
            border-radius: 8px;
            border: 1px solid #eee;
            display: none;
            text-align: center;
        }

        .address-code {
            font-size: 24px;
            font-weight: bold;
            color: #3a75c4;
            letter-spacing: 1px;
            margin: 10px 0;
        }

        .loader {
            display: none;
            margin: 15px auto;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--secondary-color);
            border-radius: 50%;
            width: 25px;
            height: 25px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="flag-bar">
        <div class="flag-green"></div>
        <div class="flag-yellow"></div>
        <div class="flag-blue"></div>
    </div>
    
    <h1>Enregistrement National</h1>
    <p>Associez votre identité à votre code géographique unique pour figurer dans le registre.</p>

    <button class="btn-gps" onclick="obtenirLocalisation()">1. Capter ma position GPS</button>
    <div class="loader" id="loader"></div>

    <div class="result-box" id="resultBox">
        <div style="font-size: 12px; color: #999;">Votre code généré localement :</div>
        <div class="address-code" id="addressCode">GA-XXXX-XX</div>
    </div>

    <div id="formulaireIdentite" style="margin-top: 20px; display: none;">
        <h2>Détails du lieu</h2>
        <div class="form-group">
            <label for="nom">Nom complet de l'occupant</label>
            <input type="text" id="nom" placeholder="Ex: Jean Mustapha">
        </div>
        <div class="form-group">
            <label for="tel">Numéro de téléphone</label>
            <input type="tel" id="tel" placeholder="Ex: +241 077... / 065...">
        </div>
        <div class="form-group">
            <label for="desc">Description précise de la maison</label>
            <textarea id="desc" rows="3" placeholder="Ex: Portail noir, barrière blanche, juste après l'épicerie du coin."></textarea>
        </div>
        <button class="btn-submit" onclick="enregistrerSurServeur()">2. Enregistrer l'adresse</button>
    </div>
</div>

<script>
    const BASE32 = "0123456789bcdefghjkmnpqrstuvwxyz";
    let coordonnesActuelles = { lat: null, lon: null };
    let codeGenere = "";

    // CONFIGURATION : Remplace cette URL par celle de ton serveur Railway une fois déployé
    const SERVEUR_URL = "https://ton-projet-railway.up.railway.app";

    function encodeGeohash(lat, lon, precision = 9) {
        let latMin = -90, latMax = 90, lonMin = -180, lonMax = 180;
        let geohash = "", bit = 0, ch = 0, evenBit = true;

        while (geohash.length < precision) {
            if (evenBit) {
                let lonMid = (lonMin + lonMax) / 2;
                if (lon >= lonMid) { ch |= (1 << (4 - bit)); lonMin = lonMid; } else { lonMax = lonMid; }
            } else {
                let latMid = (latMin + latMax) / 2;
                if (lat >= latMid) { ch |= (1 << (4 - bit)); latMin = latMid; } else { latMax = latMid; }
            }
            evenBit = !evenBit;
            if (bit < 4) { bit++; } else { geohash += BASE32[ch]; bit = 0; ch = 0; }
        }
        return geohash;
    }

    function obtenirLocalisation() {
        const loader = document.getElementById('loader');
        const resultBox = document.getElementById('resultBox');
        const formulaire = document.getElementById('formulaireIdentite');

        if (!navigator.geolocation) return alert("Géolocalisation non supportée.");

        loader.style.display = "block";
        resultBox.style.display = "none";
        formulaire.style.display = "none";

        navigator.geolocation.getCurrentPosition(
            (position) => {
                coordonnesActuelles.lat = position.coords.latitude;
                coordonnesActuelles.lon = position.coords.longitude;

                const hash = encodeGeohash(coordonnesActuelles.lat, coordonnesActuelles.lon, 9);
                codeGenere = `GA-${hash.substring(0, 4).toUpperCase()}-${hash.substring(4, 9).toUpperCase()}`;

                document.getElementById('addressCode').innerText = codeGenere;
                
                loader.style.display = "none";
                resultBox.style.display = "block";
                formulaire.style.display = "block"; // Affiche la suite du processus
            },
            (error) => {
                loader.style.display = "none";
                alert("Erreur GPS. Assurez-vous d'être en HTTPS et d'avoir activé votre localisation.");
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    }

    function enregistrerSurServeur() {
        const nom = document.getElementById('nom').value;
        const telephone = document.getElementById('tel').value;
        const description = document.getElementById('desc').value;

        const payload = {
            code: codeGenere,
            lat: coordonnesActuelles.lat,
            lon: coordonnesActuelles.lon,
            nom: nom,
            telephone: telephone,
            description: description
        };

        // Envoi des données vers l'API Back-End sur Railway
        fetch(`${SERVEUR_URL}/api/v1/address/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert("Félicitations ! Votre adresse est officiellement enregistrée au niveau national.");
            } else {
                alert("Erreur lors de l'enregistrement : " + data.error);
            }
        })
        .catch(err => {
            console.error(err);
            alert("Impossible de joindre le serveur national. Vérifiez l'URL de votre backend Railway.");
        });
    }
</script>

</body>
</html>
